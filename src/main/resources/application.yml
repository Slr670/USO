# ===================================================================
# การกำหนดค่าคอนฟิกูเรชันหลักของแอปพลิเคชัน (Spring Boot Configuration)
# โครงการ: โครงการเพิ่มประสิทธิภาพโครงข่ายสื่อสาร SHF
# ===================================================================

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: shf-dashboard
  thymeleaf:
    cache: false # ปิดแคชขณะพัฒนา เพื่อให้แสดงผลการเปลี่ยนแปลง Template ได้ทันที
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html

# ข้อมูลเมทาดาทาและเวอร์ชันของระบบ (Authoritative Application Metadata)
app:
  version: 2.4.3
  title: Super High Frequency (SHF) Repeater Network Optimization Project
  subtitle: Project Operations & Maintenance Center (SHF Network Operations Dashboard)
